name: PGS v0.0.3 - Full candidate validation
on:
  workflow_dispatch:
    inputs:
      authorized_input:
        description: Confirm authorization to use the configured hash-pinned game input and existing PGS signer
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pgs-v0.0.3-validation
  cancel-in-progress: false
jobs:
  validate:
    name: Validate a full candidate without publishing an APK
    if: github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/main' && inputs.authorized_input == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGS_VERSION: v0.0.3
      PGS_BUILD_TOOLS: '36.0.0'
      PGS_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release ledger and authorized profile identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat pgs/PGS_LAST_VERSION_CODE)" = 2026111605
          test "$(cat pgs/VERSION)" = 0.0.2
          python -B -c "import sys; sys.path.insert(0, 'tools'); from game_update import current_profile; p=current_profile(); assert p['game_version']=='0.439.0' and p['version_code']==2026111602"
      - name: Check required private configuration before installing tools
        env:
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL || secrets.PGS_INPUT_URL }}
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGS_KEYSTORE_BASE64 }}
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in PGS_INPUT_URL PGS_KEYSTORE_BASE64 PGS_KEY_ALIAS PGS_STORE_PASSWORD PGS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required configuration: $name. Configure the authorized repository Actions secret."
              missing=1
            fi
          done
          test "$missing" = 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
          python -m pip install "cmake==4.4.4" "ninja==1.13.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "PGS_ART_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "PGS_NATIVE_DEPS=$RUNNER_TEMP/pgs-native-deps" >> "$GITHUB_ENV"
      - name: Prepare verified dependencies and execute source checks
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/prepare_native.py --download
          python -c "import sys; sys.path.insert(0, 'pgs'); import dex_bridges; dex_bridges.dependencies(download=True)"
          python -B tools/check.py
      - name: Configure existing signer path
        shell: bash
        run: echo "PGS_KEYSTORE=$RUNNER_TEMP/pgs-v003-validation.jks" >> "$GITHUB_ENV"
      - name: Validate configured private input and load existing key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL || secrets.PGS_INPUT_URL }}
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$PGS_INPUT_URL" || { echo "::error::PGS_INPUT_URL is missing"; exit 1; }
          test -n "$PGS_KEYSTORE_BASE64" || { echo "::error::PGS_KEYSTORE_BASE64 is missing"; exit 1; }
          python -B tools/private_input.py
      - name: Build and verify complete candidate in runner only
        env:
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f "$PGS_KEYSTORE"
          test -n "$PGS_KEY_ALIAS"
          test -n "$PGS_STORE_PASSWORD"
          test -n "$PGS_KEY_PASSWORD"
          python -B pgs/nonroot.py --apk pgs/input/game.apkm
          mapfile -t reports < <(find pgs/build/nonroot -mindepth 2 -maxdepth 2 -name report.json -type f)
          test "${#reports[@]}" = 1
          python -B pgs/release_apk.py --run "$(dirname "${reports[0]}")" --output "$RUNNER_TEMP/pgs-v003-validation"
          python -B -c "import json, pathlib, os; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pgs-v003-validation/PGS.json').read_text()); assert d['pgs_version']=='v0.0.3' and d['version_code']==2026111606 and d['publish_ready'] is False and d['device_tested'] is False"
      - name: Upload verification receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-v0.0.3-validation-receipts
          path: |
            ${{ runner.temp }}/pgs-v003-validation/PGS.json
            ${{ runner.temp }}/pgs-v003-validation/build-info.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary signing key and candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/pgs-v003-validation.jks" "$RUNNER_TEMP/pgs-v003-validation/PGS.apk" "$RUNNER_TEMP/pgs-v003-validation/unsigned.apk" "$RUNNER_TEMP/pgs-v003-validation/aligned.apk" pgs/input/game.apkm
