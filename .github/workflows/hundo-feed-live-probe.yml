name: Hundo feed production read-only probe
on:
  pull_request:
    paths:
      - '.github/workflows/hundo-feed-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect the existing public Worker without modifying it
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import datetime
          import json
          import time
          import urllib.error
          import urllib.request
          base = "https://pgs-hundo-feed.lucianotoscano.workers.dev"
          paths = ["/status.json", "/hundos.json", "/sources.json"]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def inspect(path):
              out = {"path": path, "observed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  opener = urllib.request.build_opener(NoRedirect())
                  req = urllib.request.Request(base + path, headers={"Accept": "application/json", "User-Agent": "PGS-Hundo-Feed-QA/1 (+https://github.com/LucianoToscano/PGS)"})
                  with opener.open(req, timeout=12) as response:
                      out["http_status"] = response.status
                      out["content_type"] = response.headers.get_content_type()
                      raw = response.read(1048577)
                  if len(raw) > 1048576:
                      raise ValueError("response too large")
                  body = json.loads(raw.decode("utf-8-sig"))
                  if not isinstance(body, dict):
                      raise ValueError("unexpected JSON envelope")
                  now = int(time.time() * 1000)
                  if path == "/status.json":
                      out["snapshot_time"] = body.get("time")
                      keys = ("provider", "status", "state", "detail_status", "state_label", "reason", "http_status", "content_type", "active", "received", "validated", "discarded", "last_success", "last_attempt", "next_attempt", "next_retry", "failures")
                      out["connections"] = [{k:c.get(k) for k in keys if k in c} for c in body.get("connections", []) if isinstance(c, dict)]
                  elif path == "/hundos.json":
                      out["version"] = body.get("v")
                      out["fetched_ms"] = body.get("fetched_ms")
                      out["age_seconds"] = round((now - body["fetched_ms"]) / 1000) if isinstance(body.get("fetched_ms"), int) else None
                      out["coordinate_precision"] = body.get("coordinate_precision")
                      for key in ("hundos", "spots"):
                          rows = body.get(key)
                          if not isinstance(rows, list):
                              raise ValueError("missing compact array")
                          out[key + "_count"] = len(rows)
                          out[key + "_unexpired_count"] = sum(isinstance(r, list) and len(r) == 8 and isinstance(r[5], (int,float)) and r[5] > now for r in rows)
                      out["source_counts"] = {name:{k:v[k] for k in ("active", "unique", "status", "http_status") if k in v} for name,v in body.get("sources", {}).items() if isinstance(v, dict)}
                  else:
                      out["providers"] = [{k:p[k] for k in ("provider", "status", "categories") if k in p} for p in body.get("providers", []) if isinstance(p, dict)]
                  out["result"] = "observed"
              except urllib.error.HTTPError as error:
                  out.update(result="http_error", http_status=error.code)
              except Exception as error:
                  out.update(result="unavailable", error_type=type(error).__name__)
              return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              report = list(pool.map(inspect, paths))
          for result in report:
              print(json.dumps(result, ensure_ascii=True, sort_keys=True))
          if any(result["result"] != "observed" for result in report):
              print("::warning::Live probe incomplete; no availability conclusion for failed requests.")
          PY
  candidate:
    name: Single authorized candidate collection (no Cloudflare writes)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check candidate against existing configured providers once
        working-directory: tools/hundo-feed/cloudflare
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          import worker from "./worker.mjs";
          const config=JSON.parse(readFileSync("wrangler.json","utf8"));
          const sources=JSON.parse(config.vars.SOURCES);
          const approved=new Map([
            ["faustusfoundry","https://feed.faustusfoundry.com/pgrazor/hundos.json"],
            ["nycpokemap","https://nycpokemap.com/query2.php"],
            ["sgpokemap","https://sgpokemap.com/query2.php"],
            ["londonpogomap","https://londonpogomap.com/query2.php"],
            ["sydneypogomap","https://sydneypogomap.com/query2.php"],
            ["vanpokemap","https://vanpokemap.com/query2.php"],
            ["iflowgo-pokemon","https://pokecoords.iflowgo.com/iflowgopokecoords/api/v1/pokemon-search"],
            ["moonani","https://moonani.com/PokeList/ajax.php"]
          ]);
          assert.equal(sources.length,approved.size);
          assert.equal(new Set(sources.map(s=>s.name)).size,approved.size);
          for (const source of sources) assert.equal(source.url,approved.get(source.name));
          assert.ok(sources.reduce((sum,s)=>sum+(s.max_pages??1),0)<=14);
          // Use real upstream requests only once, within the existing candidate's
          // budget. No credentials, no bypass, no retry loop, no production writes.
          const db=new Map();
          const env={SOURCES:config.vars.SOURCES,
            FEED:{get:async k=>JSON.parse(db.get(k)||"null"),put:async(k,v)=>db.set(k,v)}};
          await worker.scheduled({},env);
          const request=path=>worker.fetch(new Request("https://example.invalid"+path),env);
          const status=await (await request("/status.json")).json();
          console.log("CANDIDATE_STATUS "+JSON.stringify({observed_at:new Date().toISOString(),summary:status.summary,connections:status.connections}));
          const response=await request("/hundos.json");
          if (!response.ok) {
            console.log("CANDIDATE_FEED "+JSON.stringify({http_status:response.status,result:"no successful collection"}));
          } else {
            const body=await response.json(),now=Date.now();
            console.log("CANDIDATE_FEED "+JSON.stringify({http_status:response.status,version:body.v,
              exact:body.coordinate_precision==="exact",hundos:body.hundos.length,spots:body.spots.length,
              unexpired:body.hundos.concat(body.spots).filter(row=>row[5]>now).length,sources:body.sources}));
          }
          console.log("CANDIDATE_NOTE Not a Cloudflare deployment. Runtime and egress differ. No raw rows recorded.");
          JS
      - name: Prepare immutable deployment candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/hundo-candidate"
          cp tools/hundo-feed/cloudflare/{worker.mjs,worker.test.mjs,wrangler.json,README.md} "${RUNNER_TEMP}/hundo-candidate/"
          cd "${RUNNER_TEMP}/hundo-candidate"
          sha256sum worker.mjs worker.test.mjs wrangler.json README.md > SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > TESTED_SHA
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PGS-Hundo-Worker-candidate
          path: ${{ runner.temp }}/hundo-candidate/
          if-no-files-found: error
          retention-days: 14
