<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%pgs-shield.png" />
    <title>PGS — smoother Pokémon GO sessions</title>
    <meta
      name="description"
      content="PGS is a compact, open-source Android interface for Pokémon GO: location controls, catching helpers, and optional automation. One APK for ARM64 Android phones and the MuMu emulator, no root required."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#141b25" />
    <link rel="canonical" href="https://lucianotoscano.github.io/PGS/" />
    <link rel="alternate" hreflang="en" href="https://lucianotoscano.github.io/PGS/" />
    <link rel="alternate" hreflang="pt-BR" href="https://lucianotoscano.github.io/PGS/?lang=pt-BR" />
    <meta property="og:title" content="PGS" />
    <meta
      property="og:description"
      content="A compact Android interface for Pokémon GO location controls, catching, and optional automation. Independent and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucianotoscano.github.io/PGS/" />
    <meta property="og:image" content="https://lucianotoscano.github.io/PGS/pgs-full.png" />
    <!-- Apply the saved theme before first paint (default dark) to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pgs-theme');
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
        document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#f9fbfd' : '#141b25';
        try {
          var requested = new URLSearchParams(window.location.search).get('lang');
          var storedLanguage = localStorage.getItem('pgs-website-language');
          document.documentElement.lang = requested === 'pt-BR' || (!requested && storedLanguage === 'pt-BR') ? 'pt-BR' : 'en';
        } catch (error) {
          document.documentElement.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PGS is an open-source Android toolkit for Pokémon GO. <a href="https://github.com/LucianoToscano/PGS/actions/runs/45980315394">Download the verified PGS candidate</a>. Enable JavaScript to explore the settings guide.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
