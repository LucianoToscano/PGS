name: PGS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify PGS identity
        run: |
          test "$(cat pgs/VERSION)" = "0.0.5"
          test "$(cat pgs/PGS_LAST_VERSION_CODE)" = "2026111608"
          grep -q 'com.nianticlabs.pokemongo' pgs/pgs_update.py
