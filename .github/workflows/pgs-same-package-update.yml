# Archived implementation and exact build history:
# https://github.com/LucianoToscano/PGS/blob/5824214bdba54178b968d5239537dfc93f1fe114/.github/workflows/pgs-same-package-update.yml
name: PGS v0.3.8-pgs.3 - archived (no rebuild)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse historical controls-only rebuild on migrated sources
        shell: bash
        run: |
          echo "::error::This historical release cannot be rebuilt from current sources. Use the authorized full PGS candidate validation workflow."
          exit 1
