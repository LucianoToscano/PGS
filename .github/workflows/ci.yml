name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regressions:
    name: Native regressions (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify C++ compiler
        run: g++ --version
      - name: Exercise production native modules with host fixtures
        run: python -B -m unittest discover -s pgs/test -p 'test_*_native.py' -v
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PGS_BUILD_TOOLS: 36.0.0
      PGS_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
      - name: Prepare pinned DEX test dependencies
        run: python -c "import sys; sys.path.insert(0, 'pgs'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: Verify standalone PGS release test discovery (no signing)
        run: python -B -m unittest discover -s pgs/test -p 'test_pgs_*.py' -v
      - name: General source checks with candidate version override
        env:
          PGS_VERSION: v0.0.3
        run: python -B tools/check.py
      - name: Compile Android controls (not a playable game build)
        run: python -B pgs/build.py
      - name: Compile Root installer (no game input or signing secrets)
        run: python -B pgs/rooted_installer.py --check
      - name: Package source and tools only
        run: python -B tools/source_bundle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-source-tools
          path: dist/PGS-source-tools.zip
          if-no-files-found: error
          retention-days: 14

  android-native-build:
    name: Android native ABI build (no signing)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGS_NATIVE_PILOT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android NDKs and build tools
        run: |
          sdkmanager "ndk;27.3.13750724" "ndk;29.0.14206865"
          python -m pip install "cmake==4.4.4" "ninja==1.13.2"
          test -f "$ANDROID_SDK_ROOT/ndk/27.3.13750724/source.properties"
          test -f "$ANDROID_SDK_ROOT/ndk/29.0.14206865/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "PGS_ART_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "PGS_NATIVE_DEPS=$RUNNER_TEMP/pgs-native-deps" >> "$GITHUB_ENV"
      - name: Prepare verified pinned source dependencies
        run: python -B tools/prepare_native.py --download
      - name: Compile core and ART for both supported Android ABIs
        run: |
          python -B pgs/native_build.py --abi arm64-v8a --abi x86_64
          python -B pgs/art_build.py --abi arm64-v8a --abi x86_64
      - name: Verify new ELF SONAMEs
        shell: bash
        run: |
          set -euo pipefail
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for library in libpgs-core.so libpgs-art.so; do
            mapfile -t files < <(find pgs/build -type f -name "$library")
            test "${#files[@]}" -ge 2
            for file in "${files[@]}"; do
              "$READELF" -d "$file" | grep -F "[$library]"
            done
          done
