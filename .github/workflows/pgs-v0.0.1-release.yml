name: PGS v0.0.1 - Complete signed candidate

on:
  push:
    branches: [release/pgs-v0.0.1, main]
    paths: [.github/workflows/pgs-v0.0.1-release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgs-v0.0.1-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PGRAZOR_BUILD_TOOLS: '36.0.0'
      PGRAZOR_ANDROID_PLATFORM: android-36
      PGRAZOR_VERSION: v0.0.1
      PGS_SOURCE_SHA: ${{ github.sha }}
      PGS_EXPECTED_CERT_SHA256: d95c6bdfcbd91dc5c9cde698487c88e4994771a475e4efde4567b8d5f44e96cf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # Fetch immediately: a newly sealed signed URL is valid for only a short time.
      # No decrypted URL, password or private key is written to GITHUB_ENV or a log.
      - name: Set runner-local signing path
        run: printf 'PGRAZOR_KEYSTORE=%s/pgs-community-signing.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Recover and verify private game input
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGRAZOR_INPUT_URL: ${{ secrets.PGS_INPUT_URL || secrets.PGRAZOR_INPUT_URL }}
          PGRAZOR_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGRAZOR_KEYSTORE_BASE64 }}
          PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
          PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
          PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
          PGS_SEALED_INPUT: |
            format=PGS_BUILD_INPUT_V1
            rsa_
            nonce=EHnAP3a+1o3O53Qh
            
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$PGS_SOURCE_SHA"
          cat > "$RUNNER_TEMP/PreparePrivateInput.java" <<'PGS_JAVA'
          import java.io.StringReader;
          import java.net.URI;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.LinkOption;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;
          import java.nio.file.attribute.PosixFilePermissions;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.security.interfaces.RSAPublicKey;
          import java.security.spec.MGF1ParameterSpec;
          import java.util.Arrays;
          import java.util.Base64;
          import java.util.HexFormat;
          import java.util.Map;
          import java.util.Properties;
          import java.util.Set;
          import javax.crypto.Cipher;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.OAEPParameterSpec;
          import javax.crypto.spec.PSource;
          import javax.crypto.spec.SecretKeySpec;
          
          /** Runner-only input preparation. Never writes or prints the decrypted URL. */
          public final class PreparePrivateInput {
              private static final String FORMAT = "PGS_BUILD_INPUT_V1";
              private static String phase = "configuration";
          
              private static String required(String name) {
                  String value = System.getenv(name);
                  if (value == null || value.isBlank()) throw new IllegalArgumentException();
                  return value;
              }
          
              private static byte[] decode(Properties data, String name) {
                  String value = data.getProperty(name);
                  if (value == null || value.length() > 65_536) throw new IllegalArgumentException();
                  return Base64.getDecoder().decode(value);
              }
          
              private static String unseal(PrivateKey key, int rsaBytes) throws Exception {
                  String sealed = required("PGS_SEALED_INPUT");
                  if (sealed.length() > 100_000) throw new IllegalArgumentException();
                  Properties data = new Properties() {
                      @Override public synchronized Object put(Object key, Object value) {
                          if (containsKey(key)) throw new IllegalArgumentException();
                          return super.put(key, value);
                      }
                  };
                  data.load(new StringReader(sealed));
                  if (!data.stringPropertyNames().equals(Set.of("format", "rsa_key", "nonce", "ciphertext"))
                          || !FORMAT.equals(data.getProperty("format"))) throw new IllegalArgumentException();
                  byte[] wrapped = decode(data, "rsa_key");
                  byte[] nonce = decode(data, "nonce");
                  byte[] ciphertext = decode(data, "ciphertext");
                  if (wrapped.length != rsaBytes || nonce.length != 12
                          || ciphertext.length < 17 || ciphertext.length > 32_768) {
                      throw new IllegalArgumentException();
                  }
                  byte[] aesKey = null;
                  byte[] plaintext = null;
                  try {
                      Cipher rsa = Cipher.getInstance("RSA/ECB/OAEPWithSHA-256AndMGF1Padding");
                      rsa.init(Cipher.DECRYPT_MODE, key, new OAEPParameterSpec(
                              "SHA-256", "MGF1", MGF1ParameterSpec.SHA256, PSource.PSpecified.DEFAULT));
                      aesKey = rsa.doFinal(wrapped);
                      if (aesKey.length != 32) throw new IllegalArgumentException();
                      Cipher aes = Cipher.getInstance("AES/GCM/NoPadding");
                      aes.init(Cipher.DECRYPT_MODE, new SecretKeySpec(aesKey, "AES"),
                              new GCMParameterSpec(128, nonce));
                      aes.updateAAD(FORMAT.getBytes(StandardCharsets.UTF_8));
                      plaintext = aes.doFinal(ciphertext);
                      return new String(plaintext, StandardCharsets.UTF_8);
                  } finally {
                      if (aesKey != null) Arrays.fill(aesKey, (byte) 0);
                      if (plaintext != null) Arrays.fill(plaintext, (byte) 0);
                  }
              }
          
              private static void validateUrl(String url) throws Exception {
                  if (url.length() > 32_000 || url.chars().anyMatch(c -> c <= 32 || c == 127)) {
                      throw new IllegalArgumentException();
                  }
                  URI parsed = new URI(url);
                  if (!"https".equals(parsed.getScheme()) || parsed.getHost() == null
                          || parsed.getUserInfo() != null || parsed.getFragment() != null) {
                      throw new IllegalArgumentException();
                  }
              }
          
              private static void prepare() throws Exception {
                  char[] storePassword = required("PGRAZOR_STORE_PASSWORD").toCharArray();
                  char[] keyPassword = required("PGRAZOR_KEY_PASSWORD").toCharArray();
                  byte[] encoded = null;
                  Path signing = null;
                  boolean signingCreated = false;
                  boolean success = false;
                  try {
                      String expected = required("PGS_EXPECTED_CERT_SHA256");
                      if (!expected.matches("[a-f0-9]{64}")) throw new IllegalArgumentException();
                      String alias = required("PGRAZOR_KEY_ALIAS");
                      String base64 = required("PGRAZOR_KEYSTORE_BASE64");
                      if (base64.length() > 8_000_000) throw new IllegalArgumentException();
                      Path temp = Path.of(required("RUNNER_TEMP")).toRealPath();
                      signing = Path.of(required("PGRAZOR_KEYSTORE")).toAbsolutePath().normalize();
                      if (!signing.getParent().equals(temp) || Files.exists(signing, LinkOption.NOFOLLOW_LINKS)) {
                          throw new IllegalArgumentException();
                      }
                      encoded = Base64.getDecoder().decode(base64);
                      Files.createFile(signing, PosixFilePermissions.asFileAttribute(
                              PosixFilePermissions.fromString("rw-------")));
                      signingCreated = true;
                      Files.write(signing, encoded, StandardOpenOption.WRITE);
                      phase = "signing certificate";
                      KeyStore store = KeyStore.getInstance(signing.toFile(), storePassword);
                      Certificate certificate = store.getCertificate(alias);
                      if (certificate == null || !(certificate.getPublicKey() instanceof RSAPublicKey publicKey)) {
                          throw new IllegalArgumentException();
                      }
                      String actual = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
                              .digest(certificate.getEncoded()));
                      if (!MessageDigest.isEqual(expected.getBytes(StandardCharsets.US_ASCII),
                              actual.getBytes(StandardCharsets.US_ASCII))) throw new IllegalArgumentException();
                      if (!(store.getKey(alias, keyPassword) instanceof PrivateKey privateKey)) {
                          throw new IllegalArgumentException();
                      }
                      phase = "sealed input";
                      String url = System.getenv("PGRAZOR_INPUT_URL");
                      if (url == null || url.isBlank()) {
                          url = unseal(privateKey, (publicKey.getModulus().bitLength() + 7) / 8);
                      }
                      validateUrl(url);
                      phase = "pinned input download";
                      ProcessBuilder command = new ProcessBuilder("python", "-B", "tools/private_input.py");
                      Map<String, String> child = command.environment();
                      child.put("PGRAZOR_INPUT_URL", url);
                      child.remove("PGRAZOR_STORE_PASSWORD");
                      child.remove("PGRAZOR_KEY_PASSWORD");
                      child.remove("PGRAZOR_KEY_ALIAS");
                      child.remove("PGS_SEALED_INPUT");
                      child.remove("PGS_EXPECTED_CERT_SHA256");
                      // Fail with a fixed message; even future helper exceptions cannot echo the URL.
                      command.redirectOutput(ProcessBuilder.Redirect.DISCARD);
                      command.redirectError(ProcessBuilder.Redirect.DISCARD);
                      Process download = command.start();
                      child.remove("PGRAZOR_INPUT_URL");
                      int status = download.waitFor();
                      if (status != 0) throw new IllegalStateException();
                      success = true;
                      System.out.println("Pinned game input verified; temporary signing key is ready.");
                  } finally {
                      Arrays.fill(storePassword, '\0');
                      Arrays.fill(keyPassword, '\0');
                      if (encoded != null) Arrays.fill(encoded, (byte) 0);
                      if (!success && signingCreated) Files.deleteIfExists(signing);
                  }
              }
          
              public static void main(String[] args) {
                  try {
                      if (args.length != 0) throw new IllegalArgumentException();
                      prepare();
                  } catch (Exception error) {
                      System.err.println("Private input preparation failed at " + phase
                              + ". Check the configured signing secrets, sealed input and pinned game profile.");
                      System.exit(1);
                  }
              }
          }
          PGS_JAVA
          java "$RUNNER_TEMP/PreparePrivateInput.java"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDKs and native build tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
          python -m pip install "cmake==4.4.4" "ninja==1.13.2"
      - name: Configure native prerequisites
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -f "$sdk_root/ndk/27.3.13750724/source.properties"
          test -f "$sdk_root/ndk/29.0.14206865/source.properties"
          {
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_root"
            printf 'ANDROID_NDK_HOME=%s\n' "$sdk_root/ndk/27.3.13750724"
            printf 'PGRAZOR_ART_NDK=%s\n' "$sdk_root/ndk/29.0.14206865"
            printf 'PGRAZOR_NATIVE_DEPS=%s\n' "$RUNNER_TEMP/pgs-native-deps"
          } >> "$GITHUB_ENV"
      - name: Prepare verified native sources and DEX dependencies
        run: |
          set -euo pipefail
          python -B tools/prepare_native.py --download
          python -B pgrazor/art_build.py --check
          python -B - <<'PGS_DEX_CACHE'
          """Runner-only cache preflight for the four SHA-256-pinned Maven dependencies."""
          import email.utils
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          HOSTS = ('repo.maven.apache.org', 'repo1.maven.org')
          ATTEMPTS = 2
          MAX_WAIT = 30
          MAX_BYTES = 16 * 1024 * 1024
          
          
          def checked_url(url):
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != 'https' or parsed.netloc not in HOSTS
                      or not parsed.path.startswith('/maven2/') or parsed.query or parsed.fragment):
                  raise ValueError('DEX dependencies require an official HTTPS Maven URL')
              return parsed
          
          
          class HttpsMavenRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  checked_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          
          
          def retry_after(value):
              if not value:
                  return 0.0
              try:
                  if value.strip().isdigit():
                      return float(value.strip())
                  return max(0.0, email.utils.parsedate_to_datetime(value).timestamp() - time.time())
              except (ValueError, TypeError, OverflowError):
                  return 0.0
          
          
          def fetch(item, opener):
              parsed = checked_url(item['url'])
              name = Path(parsed.path).name
              for host in HOSTS:
                  url = urllib.parse.urlunsplit(parsed._replace(netloc=host))
                  for attempt in range(ATTEMPTS):
                      wait = 2 ** (attempt + 1)
                      try:
                          request = urllib.request.Request(url, headers={'User-Agent': 'PGS-pinned-dependencies/1'})
                          with opener.open(request, timeout=45) as response:
                              checked_url(response.geturl())
                              data = response.read(MAX_BYTES + 1)
                          if len(data) > MAX_BYTES or hashlib.sha256(data).hexdigest() != item['sha256']:
                              raise ValueError('Pinned DEX checksum/size mismatch: ' + name)
                          return data
                      except urllib.error.HTTPError as error:
                          if error.code not in (408, 429, 500, 502, 503, 504):
                              break
                          wait = max(wait, retry_after(error.headers.get('Retry-After')))
                      except (urllib.error.URLError, TimeoutError, OSError):
                          pass
                      if attempt + 1 == ATTEMPTS or wait > MAX_WAIT:
                          # A long server delay ends this host; never retry it before Retry-After.
                          break
                      print('Retrying pinned DEX dependency:', name, 'host:', host, 'wait seconds:', round(wait, 2))
                      time.sleep(wait)
              raise RuntimeError('Official Maven hosts could not supply pinned DEX dependency: ' + name)
          
          
          def main():
              sys.path.insert(0, 'pgrazor')
              import dex_bridges
              items = json.loads((dex_bridges.TOOLS / 'dependencies.json').read_text(encoding='utf-8'))
              if len(items) != 4:
                  raise ValueError('Expected the four reviewed DEX dependencies')
              cache = dex_bridges.CACHE
              cache.mkdir(parents=True, exist_ok=True)
              if cache.is_symlink():
                  raise ValueError('DEX cache must not be a symlink')
              opener = urllib.request.build_opener(HttpsMavenRedirect())
              names = set()
              for item in items:
                  name = Path(checked_url(item['url']).path).name
                  if not name.endswith('.jar') or name in names or not re.fullmatch('[0-9a-f]{64}', item['sha256']):
                      raise ValueError('Invalid pinned DEX dependency manifest')
                  names.add(name)
                  target = cache / name
                  if target.is_symlink():
                      raise ValueError('DEX dependency must not be a symlink')
                  if target.exists():
                      if not target.is_file() or dex_bridges.sha256(target) != item['sha256']:
                          raise ValueError('Existing DEX dependency checksum mismatch: ' + name)
                  else:
                      data = fetch(item, opener)  # SHA-256 checked before any cache write.
                      temporary = None
                      try:
                          with tempfile.NamedTemporaryFile(dir=cache, prefix='.' + name + '.', delete=False) as stream:
                              temporary = Path(stream.name)
                              stream.write(data)
                              stream.flush()
                              os.fsync(stream.fileno())
                          temporary.replace(target)
                      finally:
                          if temporary is not None:
                              temporary.unlink(missing_ok=True)
                  print('Pinned DEX cache verified:', name)
              dex_bridges.dependencies(download=False)
          
          
          if __name__ == '__main__':
              main()
          PGS_DEX_CACHE
      - name: Compile Android controls
        env:
          PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
          PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
          PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$PGS_SOURCE_SHA"
          python -B pgrazor/build.py
      - name: Check all device-free suites
        run: env -u PGRAZOR_KEYSTORE python -B tools/check.py
      - name: Build playable non-root package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
          PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
          PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$PGS_SOURCE_SHA"
          python -B pgrazor/nonroot.py --apk pgrazor/input/game.apkm --google-browser-login --skip-build --download-runtime
      - name: Produce signed single APK
        env:
          PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
          PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
          PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$PGS_SOURCE_SHA"
          python -B - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          candidates = [p for p in Path('pgrazor/build/nonroot').iterdir()
                        if p.is_dir() and (p / 'report.json').is_file()]
          if not candidates:
              raise SystemExit('A completed non-root build is required')
          candidate = max(candidates, key=lambda p: p.name)
          subprocess.run([sys.executable, '-B', 'pgrazor/release_apk.py',
                          '--run', str(candidate), '--output', 'dist/release'], check=True)
          PY
      - name: Verify full PGS APK and prepare versioned release assets
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import sys
          import zipfile
          sys.path.insert(0, 'pgrazor')
          import axml
          from pgs_update import PGS_SIGNER, cert_digests
          root = Path('dist/release')
          apk = root / 'PGS.apk'
          build_info = json.loads((root / 'build-info.json').read_text(encoding='utf-8'))
          if not apk.is_file() or apk.stat().st_size < 100_000_000:
              raise SystemExit('Refusing preview or incomplete APK')
          if cert_digests(apk) != [PGS_SIGNER]:
              raise SystemExit('PGS signing certificate mismatch')
          with zipfile.ZipFile(apk) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Corrupt APK')
              info = axml.inspect_manifest(archive.read('AndroidManifest.xml'))
              if (info['package'] != 'com.nianticlabs.pokemongo'
                      or info['split'] is not None
                      or info['versionName'] != '0.439.0'
                      or info['versionCode'] != 2026111604
                      or 'lib/arm64-v8a/libil2cpp.so' not in archive.namelist()):
                  raise SystemExit('Android identity, game or version continuity failed')
              mode = json.loads(archive.read('assets/pgrazor/mode.json'))
              if mode.get('pgrazorVersion') != 'v0.0.1' or not mode.get('compiledGameplay'):
                  raise SystemExit('Full package did not embed PGS v0.0.1 gameplay')
          def digest(path):
              with path.open('rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()
          checksum = digest(apk)
          if (build_info.get('apk_sha256') != checksum
                  or build_info.get('apk_version_code') != 2026111604
                  or build_info.get('game_version') != '0.439.0'
                  or build_info.get('game_version_code') != 2026111602
                  or build_info.get('source_commit') != os.environ['PGS_SOURCE_SHA']):
              raise SystemExit('Build receipt mismatch')
          output = Path('dist/PGS')
          output.mkdir(parents=True, exist_ok=False)
          file_name = 'PGS v0.0.1.apk'
          shutil.copyfile(apk, output / file_name)
          if digest(output / file_name) != checksum:
              raise SystemExit('Delivery copy does not match signed APK')
          shutil.copyfile(root / 'build-info.json', output / 'build-info.json')
          (output / 'SHA256SUMS.txt').write_text(checksum + '  ' + file_name + '\n', encoding='utf-8')
          receipt = {
              'pgs_version': 'v0.0.1', 'game_version': '0.439.0',
              'android_version_code': 2026111604,
              'package': 'com.nianticlabs.pokemongo',
              'installed_name': 'Pokémon GO', 'file': file_name,
              'sha256': checksum, 'bytes': apk.stat().st_size,
              'signing_certificate_sha256': PGS_SIGNER,
              'source_commit': os.environ['PGS_SOURCE_SHA'],
              'device_tested': False, 'in_place_update_tested': False
          }
          (output / 'PGS.json').write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('PGS signed full APK verified:', file_name, 'versionCode 2026111604 SHA256', checksum)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-v0.0.1
          path: |
            dist/PGS/PGS v0.0.1.apk
            dist/PGS/PGS.json
            dist/PGS/build-info.json
            dist/PGS/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove private runner files
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          temp = Path(os.environ['RUNNER_TEMP']).resolve()
          key = Path(os.environ['PGRAZOR_KEYSTORE'])
          if key.parent.resolve() != temp or key.is_symlink():
              raise SystemExit('Signing key is outside its runner temporary directory')
          key.unlink(missing_ok=True)
          (temp / 'PreparePrivateInput.java').unlink(missing_ok=True)
          Path('pgrazor/input/game.apkm').unlink(missing_ok=True)

  draft-release:
    name: Assemble private GitHub draft release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PGS-v0.0.1
          path: release
      - name: Check release payload before draft creation
        env:
          PGS_EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/PGS v0.0.1.apk"
          test -s release/PGS.json
          test -s release/SHA256SUMS.txt
          cd release
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json, os
          receipt=json.load(open('PGS.json',encoding='utf-8'))
          assert receipt['source_commit']==os.environ['PGS_EXPECTED_SHA']
          assert receipt['package']=='com.nianticlabs.pokemongo'
          assert receipt['android_version_code']==2026111604
          assert receipt['device_tested'] is False
          PY
      - name: Publish a draft only (pending device validation)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.1 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Draft/release already exists; not overwriting signed assets."
            exit 0
          fi
          cat docs/releases/v0.0.1.md docs/releases/footer.md > "$RUNNER_TEMP/pgs-release-notes.md"
          gh release create v0.0.1 \
            "release/PGS v0.0.1.apk" release/PGS.json \
            release/build-info.json release/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$RELEASE_COMMIT" \
            --title "PGS v0.0.1" --draft \
            --notes-file "$RUNNER_TEMP/pgs-release-notes.md"
