name: PGS - build from clean PGRazor v0.3.8
on:
  push:
    branches: [build/pgs-v0.3.8]
    paths: [.github/workflows/pgs-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
      PGRAZOR_VERSION: v0.3.8
      PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
      PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
      PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1106592aa045759f55f594ff6968f783ff636fe9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify private build configuration
        env:
          PGRAZOR_INPUT_URL: ${{ secrets.PGS_INPUT_URL || secrets.PGRAZOR_INPUT_URL }}
          PGRAZOR_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGRAZOR_KEYSTORE_BASE64 }}
        run: |
          $required = @('PGRAZOR_INPUT_URL', 'PGRAZOR_KEYSTORE_BASE64', 'PGRAZOR_KEY_ALIAS', 'PGRAZOR_STORE_PASSWORD', 'PGRAZOR_KEY_PASSWORD')
          $missing = @($required | Where-Object { ![Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) { throw ('Missing build settings (PGS_* or PGRAZOR_* secrets): ' + ($missing -join ', ')) }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PGRAZOR_KEYSTORE=$env:RUNNER_TEMP\pgs-signing.jks"
      - name: Prepare verified game input and signing key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGRAZOR_INPUT_URL: ${{ secrets.PGS_INPUT_URL || secrets.PGRAZOR_INPUT_URL }}
          PGRAZOR_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGRAZOR_KEYSTORE_BASE64 }}
        run: python -B tools/private_input.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDKs
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
      - name: Install native build tools
        run: python -m pip install "cmake==4.4.4" "ninja==1.13.2"
      - name: Configure native prerequisites
        run: |
          $sdkRoot = $env:ANDROID_SDK_ROOT
          if (!$sdkRoot) { $sdkRoot = $env:ANDROID_HOME }
          if (!$sdkRoot) { throw 'Android SDK root was not configured' }
          $gameplayNdk = Join-Path $sdkRoot 'ndk/27.3.13750724'
          $artNdk = Join-Path $sdkRoot 'ndk/29.0.14206865'
          foreach ($ndkPath in @($gameplayNdk, $artNdk)) {
            if (!(Test-Path -LiteralPath (Join-Path $ndkPath 'source.properties'))) { throw "Missing pinned NDK: $ndkPath" }
          }
          $nativeDeps = Join-Path $env:RUNNER_TEMP 'pgrazor-native-deps'
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @(
            "ANDROID_SDK_ROOT=$sdkRoot",
            "ANDROID_NDK_HOME=$gameplayNdk",
            "PGRAZOR_ART_NDK=$artNdk",
            "PGRAZOR_NATIVE_DEPS=$nativeDeps"
          )
      - name: Prepare pinned native sources
        run: |
          python -B tools/prepare_native.py --download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B pgrazor/art_build.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned DEX dependencies
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - name: Check original source
        run: python -B tools/check.py
      - name: Build complete playable package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B pgrazor/nonroot.py --apk pgrazor/input/game.apkm --google-browser-login
      - name: Produce signed single APK
        run: |
          $candidate = Get-ChildItem -LiteralPath pgrazor/build/nonroot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$candidate) { throw 'Non-root package run is missing' }
          $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
          python -B pgrazor/release_apk.py --run $candidate.FullName --output dist/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Name and verify PGS delivery
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, zipfile
          folder = Path('dist/release')
          apk = folder / 'PGRazor.apk'
          receipt = json.loads((folder / 'build-info.json').read_text())
          assert receipt['source_commit'] == '1106592aa045759f55f594ff6968f783ff636fe9'
          assert receipt['game_version'] == '0.439.0'
          assert receipt['game_version_code'] == 2026111602
          assert receipt['input_sha256'] == 'c6d3c04c38ca2f2446957633b4fee8c93dcc9cebdbbaddc9cb9651722ef8f54f'
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert digest == receipt['apk_sha256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert 'lib/arm64-v8a/libil2cpp.so' in archive.namelist()
              mode = json.loads(archive.read('assets/pgrazor/mode.json'))
              assert mode['pgrazorVersion'] == 'v0.3.8'
          apk.rename(folder / 'PGS.apk')
          (folder / 'SHA256SUMS.txt').write_text(digest + '  PGS.apk\n', encoding='utf-8')
          (folder / 'ORIGEM.txt').write_text(
              'PGS.apk: built from unchanged PGRazor v0.3.8 source.\n'
              'Source commit: 1106592aa045759f55f594ff6968f783ff636fe9\n'
              'Signed using the PGS repository build secrets.\n'
              'Original interface, installed label and gameplay code preserved.\n'
              'Device testing has not been performed.\n', encoding='utf-8')
          print('PGS.apk', (folder / 'PGS.apk').stat().st_size, digest)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PGS-v0.3.8-built-from-source
          path: |
            dist/release/PGS.apk
            dist/release/build-info.json
            dist/release/SHA256SUMS.txt
            dist/release/ORIGEM.txt
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: |
          if (!$env:PGRAZOR_KEYSTORE) { exit 0 }
          $keyPath = [IO.Path]::GetFullPath($env:PGRAZOR_KEYSTORE)
          $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (!$keyPath.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Key is outside runner temp' }
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath }
