name: PGS AUTO BUILD - Signed candidate

on:
  push:
    branches: [main]
    paths: [build-request.json]
  workflow_dispatch:
    inputs:
      authorized_input:
        description: Authorize the committed request and pinned original input
        required: true
        type: boolean
        default: false
      retain_authorized_candidate:
        description: Retain verified candidate as an unpublished draft
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pgs-signed-candidate
  cancel-in-progress: false

jobs:
  request:
    if: github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
      version: ${{ steps.request.outputs.version }}
      previous_code: ${{ steps.request.outputs.previous_code }}
      expected_code: ${{ steps.request.outputs.expected_code }}
      retain: ${{ steps.request.outputs.retain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline request and candidate tests
        run: |
          python -B -m unittest discover -s tools -p 'test_pgs_build_request.py'
          python -B -m unittest discover -s tools -p 'test_pgs_candidate_draft.py'
      - name: Validate explicit build request
        id: request
        env:
          PGS_MANUAL_AUTHORIZED: ${{ inputs.authorized_input }}
          PGS_MANUAL_RETAIN: ${{ inputs.retain_authorized_candidate }}
        run: python -B tools/pgs_build_request.py --gate

  validate:
    needs: request
    name: Build and verify signed test candidate only
    if: needs.request.outputs.enabled == 'true' && github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGS_VERSION: ${{ needs.request.outputs.version }}
      PGS_PREVIOUS_VERSION_CODE: ${{ needs.request.outputs.previous_code }}
      PGS_EXPECTED_VERSION_CODE: ${{ needs.request.outputs.expected_code }}
      PGS_RETAIN_AUTHORIZED: ${{ needs.request.outputs.retain }}
      PGS_MANUAL_AUTHORIZED: ${{ inputs.authorized_input }}
      PGS_MANUAL_RETAIN: ${{ inputs.retain_authorized_candidate }}
      PGS_BUILD_TOOLS: '36.0.0'
      PGS_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check previous signed candidate and unused version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/pgs_candidate_draft.py --preflight
      - name: Resolve the pinned game profile
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from game_update import current_profile
          p = current_profile()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for env, key in [('GAME_VERSION', 'game_version'), ('GAME_VERSION_CODE', 'version_code'), ('GAME_INPUT_SHA256', 'input_sha256')]:
                  print(f"{env}={p[key]}", file=f)
          PY
      - name: Check required private configuration before installing tools
        env:
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL }}
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 }}
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in PGS_KEYSTORE_BASE64 PGS_KEY_ALIAS PGS_STORE_PASSWORD PGS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required configuration: $name. Configure the authorized repository Actions secret."
              missing=1
            fi
          done
          test "$missing" = 0
      - name: Find and verify original game input within this repository
        env:
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          expected="$GAME_INPUT_SHA256"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          # The repository token already has access to its own draft releases.
          # Never publish or copy the original package to another repository.
          asset_url="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | python -B -c '
          import json, sys
          raw = sys.stdin.read()
          decoder = json.JSONDecoder()
          matches = []
          while raw.strip():
              raw = raw.lstrip()
              releases, end = decoder.raw_decode(raw)
              raw = raw[end:]
              for release in releases:
                  if not release.get("draft"):
                      continue
                  for asset in release.get("assets", []):
                      digest = asset.get("digest") or ""
                      # Browser uploads may have suffixes such as .apkm.1.
                      # Exact content identity is more reliable than filename.
                      if digest == "sha256:" + sys.argv[1] and asset.get("state") == "uploaded":
                          matches.append(asset["url"])
          if len(set(matches)) > 1:
              raise SystemExit("Multiple matching private original inputs; select one explicitly")
          print(matches[0] if matches else "")
          ' "$expected")"
          if [[ -n "$asset_url" ]]; then
            export PGS_INPUT_URL="$asset_url"
            echo "Found exact original APKM in an unpublished release of this repository."
          elif [[ -n "$PGS_INPUT_URL" ]]; then
            echo "Using the explicitly configured original input."
          else
            echo "::error::No original APKM matching the pinned SHA-256 was found in this repository's draft releases. Restore the build-inputs asset or configure PGS_INPUT_URL."
            exit 1
          fi
          python -B tools/private_input.py --input-only
          echo "$expected  pgs/input/game.apkm" | sha256sum -c -
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
          python -m pip install "cmake==4.4.4" "ninja==1.13.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "PGS_ART_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "PGS_NATIVE_DEPS=$RUNNER_TEMP/pgs-native-deps" >> "$GITHUB_ENV"
      - name: Prepare verified dependencies and execute source checks
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/prepare_native.py --download
          python -c "import sys; sys.path.insert(0, 'pgs'); import dex_bridges; dex_bridges.dependencies(download=True)"
          python -B tools/check.py
      - name: Configure existing signer path
        shell: bash
        run: echo "PGS_KEYSTORE=$RUNNER_TEMP/pgs-candidate-validation.jks" >> "$GITHUB_ENV"
      - name: Load the existing PGS signer after source checks
        env:
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -B tools/private_input.py --key-only
      - name: Build and verify complete candidate in runner only
        env:
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f "$PGS_KEYSTORE"
          test -n "$PGS_KEY_ALIAS"
          test -n "$PGS_STORE_PASSWORD"
          test -n "$PGS_KEY_PASSWORD"
          python -B pgs/nonroot.py --apk pgs/input/game.apkm --google-browser-login
          mapfile -t reports < <(find pgs/build/nonroot -mindepth 2 -maxdepth 2 -name report.json -type f)
          test "${#reports[@]}" = 1
          python -B pgs/release_apk.py --run "$(dirname "${reports[0]}")" --output "$RUNNER_TEMP/pgs-candidate-validation"
          python -B pgs/pgs_candidate.py "$RUNNER_TEMP/pgs-candidate-validation/PGS.apk" --tag "$PGS_VERSION" --game-version "$GAME_VERSION" --game-version-code "$GAME_VERSION_CODE" --previous-version-code "$PGS_PREVIOUS_VERSION_CODE" > "$RUNNER_TEMP/pgs-candidate-validation/PGS.json"
          python -B -c "import json, pathlib, os; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pgs-candidate-validation/PGS.json').read_text()); assert d['pgs_version']==os.environ['PGS_VERSION'] and d['version_code']==int(os.environ['PGS_EXPECTED_VERSION_CODE']) and d['publish_ready'] is False and d['device_tested'] is False"
      - name: Retain authorized signed candidate in an unpublished draft
        if: needs.request.outputs.retain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/pgs_candidate_draft.py
      - name: Upload verification receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-${{ needs.request.outputs.version }}-validation-receipts
          path: |
            ${{ runner.temp }}/pgs-candidate-validation/PGS.json
            ${{ runner.temp }}/pgs-candidate-validation/build-info.json
            ${{ runner.temp }}/pgs-candidate-validation/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key and candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/pgs-candidate-validation.jks" "$RUNNER_TEMP/pgs-candidate-validation/PGS.apk" "$RUNNER_TEMP/pgs-candidate-validation/unsigned.apk" "$RUNNER_TEMP/pgs-candidate-validation/aligned.apk" pgs/input/game.apkm
