name: PGS coordinated internal source alias retirement
on:
  push:
    branches: [refactor/pgs-mass-identity-20261127]
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/refactor/pgs-mass-identity-20261127'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Retire private aliases, verify original ABI and audit all tracked files
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 06fd50469bb98cf64b0459bddd80294cae86dc50 HEAD -- . ":!.github/workflows/pgs-one-time-retire-aliases.yml"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile
          
          ROOT = pathlib.Path.cwd()
          BASE = "06fd50469bb98cf64b0459bddd80294cae86dc50"
          TEMP = ".github/workflows/pgs-one-time-retire-aliases.yml"
          SNAP = "docs/PGS_REMAINING_REFERENCES.json"
          ALIASES = "docs/PGS_NATIVE_ALIAS_INVENTORY.json"
          def get(p): return (ROOT / p).read_bytes()
          def put(p, data): (ROOT / p).write_bytes(data)
          def edit(p, old, new, count=1):
              data=get(p)
              assert data.count(old)==count, (p,old[:100],data.count(old),count)
              put(p,data.replace(old,new))
          def replace_rx(p, pattern, replacement, count=1):
              data,n=re.subn(pattern,replacement,get(p),flags=re.M)
              assert n==count,(p,pattern,n,count)
              put(p,data)
          paths=[p.decode() for p in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if p]
          native=[p for p in paths if p.startswith("pgs/native/") and pathlib.Path(p).suffix in {".h",".hpp",".c",".cc",".cpp",".inc"}]
          old_inventory=json.loads(get(ALIASES))
          by_old={entry["old"]:entry for entry in old_inventory}
          headers=sorted({entry["header"] for entry in old_inventory})
          rxs=[
              ("constant",re.compile(rb"^[ \t]*#[ \t]*define[ \t]+(PGRAZOR_[A-Z0-9_]+)[ \t]+(PGS_[A-Z0-9_]+)[ \t]*(?:\r?\n|$)",re.M)),
              ("enumerator",re.compile(rb"^[ \t]*(PGRAZOR_[A-Z0-9_]+)[ \t]*=[ \t]*(PGS_[A-Z0-9_]+),[ \t]*(?:\r?\n|$)",re.M)),
              ("type",re.compile(rb"^[ \t]*typedef[ \t]+(pgs_[A-Za-z0-9_]+)[ \t]+(pgrazor_[A-Za-z0-9_]+);[ \t]*(?:\r?\n|$)",re.M)),
          ]
          found={}
          for h in headers:
              for kind,rx in rxs:
                  for m in rx.finditer(get(h)):
                      a,b=(x.decode() for x in m.groups())
                      old,new=(b,a) if kind=="type" else (a,b)
                      assert old not in found and new==("pgs_" if kind=="type" else "PGS_")+old[8:],(h,old,new)
                      found[old]={"old":old,"new":new,"header":h,"kind":kind}
          assert set(by_old)<=set(found),set(by_old)-set(found)
          # Capture ABI facts directly from the unchanged headers before removing source aliases.
          for h in headers:
              rows=[v for v in found.values() if v["header"]==h]
              code=['#include <type_traits>','#include <iostream>','#include <iomanip>','#include <limits>',
                    '#include "'+pathlib.Path(h).name+'"','int main(){',
                    'std::cout << std::setprecision(std::numeric_limits<long double>::max_digits10);']
              for entry in rows:
                  old,new=entry["old"],entry["new"]
                  if entry["kind"]=="type":
                      code += [f"static_assert(std::is_same_v<{old},{new}>);",
                               f'std::cout << "{old} " << sizeof({new}) << " " << alignof({new}) << "\\n";']
                  else:
                      code += [f"static_assert({old}=={new});",
                               f'std::cout << "{old} " << static_cast<long double>({new}) << "\\n";']
                      if entry["kind"]=="enumerator":
                          code += [f"static_assert(std::is_same_v<decltype({old}),decltype({new})>);"]
              code+=["}"]
              with tempfile.TemporaryDirectory() as folder:
                  executable=pathlib.Path(folder)/"baseline"
                  subprocess.run(["g++","-std=c++17","-I","pgs/native","-x","c++","-","-o",str(executable)],input="\n".join(code)+"\n",text=True,check=True,timeout=60)
                  result=subprocess.check_output([str(executable)],text=True,timeout=10)
              for line in result.splitlines():
                  old,*facts=line.split()
                  assert old in found
                  found[old]["abi_before"]={"size":int(facts[0]),"align":int(facts[1])} if found[old]["kind"]=="type" else {"value":facts[0]}
          assert all("abi_before" in v for v in found.values())
          # Remove only declarations proved equivalent above, preserving every canonical definition.
          for h in headers:
              data=get(h)
              for kind,rx in rxs:
                  data=rx.sub(b"",data)
              data=re.sub(rb"^[ \t]*// Legacy aliases retain the same enum type and numeric values\.\r?\n",b"",data,flags=re.M)
              data=data.replace(b"/* Compatibility aliases for legacy C/C++ source consumers. */\n\n",b"")
              data=data.replace(b"/* PGS source types retain the exact legacy ABI layout. */\n",b"")
              put(h,data)
          # All remaining private getter aliases now have one canonical implementation.
          getters=["accounts","adventure_sync","runtime_bootstrap","runtime_metadata","runtime_transport","shared_host","unity_scheduler"]
          for name in getters:
              p="pgs/native/"+name+".h"
              old=("pgrazor_"+name+"_api").encode()
              new=("pgs_"+name+"_api").encode()
              pat=rb"// Compatibility for older source consumers; the PGS name is the primary hidden getter\.\nstatic inline [^\n]*\b"+old+rb"\(uint32_t version\) \{\n[ \t]+return "+new+rb"\(version\);\n\}\n"
              replace_rx(p,pat,b"")
          edit("pgs/native/account_host.h",
               b"const void *pgrazor_account_host_api(uint32_t version);\n// Canonical source spelling; retain the hidden legacy linkage for older objects and fixtures.\nstatic inline const void *pgs_account_host_api(uint32_t version) {\n    return pgrazor_account_host_api(version);\n}",
               b"const void *pgs_account_host_api(uint32_t version);")
          mapping={old.encode():v["new"].encode() for old,v in found.items()}
          mapping.update({("pgrazor_"+name+"_api").encode():("pgs_"+name+"_api").encode() for name in getters+["account_host"]})
          # Private hook wrappers were never public ELF exports.
          edit("pgs/native/hook_engine.h",
               b"// Old call sites continue to link through forwarding wrappers.\nint pgrazor_hook(void *address, void *replacement, void **original);\nint pgrazor_unhook(void *address);\nint pgrazor_instrument(void *address, dobby_instrument_callback_t callback);\n\n",b"")
          edit("pgs/native/hook_engine_diag.h",
               b"\n// Compatibility name: returns the same diagnostic, installs nothing.\nint pgrazor_hook_diag(PgsHookDiag *out);\n",b"")
          p="pgs/native/hook_engine.cpp"
          d=get(p)
          at=d.index(b"// Existing modules and test fixtures may still link these old C++ names.")
          assert d[at:].count(b"pgrazor_")==4 and d[at:].strip().endswith(b"}")
          put(p,d[:at].rstrip()+b"\n")
          # Match C++ linkage in the production interaction host and its standalone fixture.
          p="pgs/native/interaction_host.cpp"
          edit(p,b'extern "C" int pgrazor_hook(void *target, void *replacement, void **original) PGS_WEAK;\nextern "C" int pgrazor_unhook(void *target) PGS_WEAK;\n',b"")
          edit(p,b'namespace {\n\n#if defined(__GNUC__) || defined(__clang__)',b'#if defined(PGS_INTERACTION_HOST_STANDALONE_TEST) && (defined(__GNUC__) || defined(__clang__))\nint pgs_hook(void *target, void *replacement, void **original) __attribute__((weak));\nint pgs_unhook(void *target) __attribute__((weak));\n#endif\n\nnamespace {\n\n#if defined(__GNUC__) || defined(__clang__)')
          for old,new in ((b"pgrazor_hook",b"pgs_hook"),(b"pgrazor_unhook",b"pgs_unhook"),(b"pgrazor_instrument",b"pgs_instrument"),(b"pgrazor_hook_diag",b"pgs_hook_diag")):
              mapping[old]=new
          p="pgs/native/interaction_host_test.cpp"
          edit(p,b'extern "C" int pgrazor_hook(',b'int pgrazor_hook(')
          edit(p,b'extern "C" int pgrazor_unhook(',b'int pgrazor_unhook(')
          # All private producers, consumers, fixtures and diagnostic labels are migrated together.
          pattern=re.compile(rb"\b(?:" + b"|".join(re.escape(k) for k in sorted(mapping,key=len,reverse=True)) + rb")\b")
          for p in native:
              data=get(p)
              if not pattern.search(data): continue
              put(p,pattern.sub(lambda m:mapping[m.group()],data))
          # Keep the duplicate public-factory ABI comparison; remove the duplicate private call.
          edit("pgs/native/hook_engine_near_test.cpp",b"        pgs_hook_diag(&diag) == 0 &&\n",b"")
          # Preserve every original ABI fact as a frozen retirement record.
          records=[]
          for old in sorted(found):
              row=dict(by_old.get(old,{}))
              row.update(found[old])
              row["retired"]=True
              records.append(row)
          put(ALIASES,(json.dumps(records,indent=2,ensure_ascii=True)+"\n").encode())
          # The retirement test below replaces the old alias-presence test with canonical
          # absence and original pre-retirement ABI assertions.
          put("pgs/test/test_pgs_native_aliases_native.py",b'''"""Verify retired source names and the original LP64 type/value contract."""
          from collections import defaultdict
          import json
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import unittest
          
          ROOT = Path(__file__).resolve().parents[2]
          NATIVE = ROOT / "pgs" / "native"
          INVENTORY = ROOT / "docs" / "PGS_NATIVE_ALIAS_INVENTORY.json"
          COMPILER = shutil.which("g++") or shutil.which("clang++")
          
          
          def aliases():
              return json.loads(INVENTORY.read_text(encoding="utf-8"))
          
          
          class PgsNativeAliasesTests(unittest.TestCase):
              def test_retired_source_names_and_canonical_declarations(self):
                  inventory = aliases()
                  self.assertGreaterEqual(len(inventory), 113)
                  names = set()
                  for entry in inventory:
                      old, new = entry["old"], entry["new"]
                      with self.subTest(alias=new):
                          self.assertTrue(entry["retired"])
                          self.assertNotIn(old, names)
                          names.add(old)
                          path = ROOT / entry["header"]
                          self.assertTrue(path.resolve().is_relative_to(NATIVE.resolve()))
                          source = path.read_text(encoding="utf-8", errors="surrogateescape")
                          self.assertNotRegex(source, r"\\b" + re.escape(old) + r"\\b")
                          self.assertRegex(source, r"\\b" + re.escape(new) + r"\\b")
                          self.assertTrue(entry["abi_before"])
          
              @unittest.skipUnless(sys.platform.startswith("linux") and COMPILER,
                                   "Native ABI baseline compilation requires Linux C++17")
              def test_canonical_types_and_constants_keep_original_abi(self):
                  by_header = defaultdict(list)
                  for entry in aliases():
                      by_header[entry["header"]].append(entry)
                  for header, entries in sorted(by_header.items()):
                      with self.subTest(header=header):
                          code = ['#include <type_traits>', '#include "' + Path(header).name + '"']
                          for entry in entries:
                              name, facts = entry["new"], entry["abi_before"]
                              if entry["kind"] == "type":
                                  code.extend([f"static_assert(sizeof({name}) == {facts['size']});",
                                               f"static_assert(alignof({name}) == {facts['align']});"])
                              else:
                                  value = facts["value"]
                                  self.assertRegex(value, r"^-?[0-9]+(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?$")
                                  code.append(f"static_assert(static_cast<long double>({name}) == static_cast<long double>({value}L));")
                                  if entry["kind"] == "enumerator":
                                      code.append(f"static_assert(std::is_enum_v<decltype({name})>);")
                          run = subprocess.run([COMPILER, "-std=c++17", "-fsyntax-only", "-x", "c++",
                                                "-I", str(NATIVE), "-"], input="\\n".join(code)+"\\n",
                                               text=True, capture_output=True, timeout=60)
                          self.assertEqual(run.returncode, 0, run.stdout + run.stderr)
          
              @unittest.skipUnless(sys.platform.startswith("linux") and COMPILER,
                                   "Native getter declarations require Linux C++17")
              def test_private_canonical_getter_declarations_link(self):
                  names = ("runtime_metadata", "runtime_bootstrap", "runtime_transport",
                           "unity_scheduler", "shared_host", "accounts", "adventure_sync", "account_host")
                  code = ['#include <type_traits>']
                  code.extend('#include "'+name+'.h"' for name in names)
                  assertions = []
                  for name in names:
                      new = "pgs_"+name+"_api"
                      typ = "pgs_accounts_api_v1_t" if name == "accounts" else "unsigned"
                      ret = "const pgs_accounts_api_v1_t*" if name == "accounts" else "const void*"
                      code.append(f'extern "C" {ret} {new}(uint32_t version) {{ static {typ} value{{}}; return version == 1 ? &value : nullptr; }}')
                      code.append(f"static_assert(std::is_same_v<decltype(&{new}), {ret}(*)(uint32_t)>);")
                      assertions.append(f"if (!{new}(1) || {new}(0) || {new}(2)) return 1;")
                  code.extend(["int main(){", *assertions, "return 0; }"])
                  with tempfile.TemporaryDirectory(prefix="pgs-getters-") as work:
                      exe = Path(work)/"getters"
                      built = subprocess.run([COMPILER,"-std=c++17","-x","c++","-I",str(NATIVE),"-","-o",str(exe)],
                                             input="\\n".join(code)+"\\n",text=True,capture_output=True,timeout=60)
                      self.assertEqual(built.returncode,0,built.stdout+built.stderr)
                      run = subprocess.run([str(exe)],capture_output=True,text=True,timeout=10)
                      self.assertEqual(run.returncode,0,run.stdout+run.stderr)
          
              def test_private_native_legacy_names_do_not_return(self):
                  for path in NATIVE.rglob("*"):
                      if not path.is_file() or path.suffix not in {".h",".hpp",".cpp",".c",".cc",".inc"}:
                          continue
                      data = path.read_bytes()
                      # Only the public factory spelling and the icon-source notice are retained.
                      if path.name == "pvp_icons.h":
                          continue
                      data = data.replace(b"pgrazor_native_api",b"")
                      self.assertNotRegex(data,rb"(?i)pgrazor",str(path.relative_to(ROOT)))
          
          
          if __name__ == "__main__":
              unittest.main()
          ''')
          p="pgs/test/test_pgs_native_identity.py"
          edit(p,b'self.assertIn("typedef pgs_native_api_v2 pgrazor_native_api_v2;", header)',b'self.assertNotIn("typedef pgs_native_api_v2 pgrazor_native_api_v2;", header)')
          edit(p,b'self.assertIn("#define PGRAZOR_NATIVE_API_VERSION PGS_NATIVE_API_VERSION", header)',b'self.assertIn("#define PGS_NATIVE_API_VERSION 1u", header)')
          edit(p,b'self.assertIn("#define PGRAZOR_ERR_BAD_LEASE PGS_ERR_BAD_LEASE", header)',b'self.assertIn("PGS_ERR_BAD_LEASE = 4", header)')
          edit(p,b"def test_hook_engine_pgs_names_and_old_cpp_linkage(self):",b"def test_hook_engine_pgs_names_and_retired_cpp_linkage(self):")
          edit(p,b'            self.assertIn("int " + legacy, impl)\n            self.assertIn("return " + modern, impl)',b'            self.assertNotIn("int " + legacy, impl)\n            self.assertNotIn("int " + legacy, header)\n            self.assertNotIn("int " + legacy, diag)')
          # Canonical name for newly generated DEX methods, and rejection of both old and new already-patched inputs.
          p="tools/dex_bridge/BridgeRewriter.java"
          edit(p,b'    static final String PREFIX="$pgrazor$original$";',b'    static final String PREFIX="$pgs$original$";\n    static final String LEGACY_PREFIX="$pgrazor$original$";')
          edit(p,b'require(!m.getName().startsWith(PREFIX),"input already patched");',b'require(!m.getName().startsWith(PREFIX)&&!m.getName().startsWith(LEGACY_PREFIX),"input already patched");')
          p="pgs/test/test_pgs_runtime_identity.py"
          edit(p,b"    def test_installed_identity_and_historical_repack_are_preserved(self):",b'''    def test_dex_bridge_uses_pgs_prefix_and_rejects_legacy_input(self):
                  bridge = (ROOT / "tools/dex_bridge/BridgeRewriter.java").read_text(encoding="utf-8")
                  self.assertIn('PREFIX="$pgs$original$"', bridge)
                  self.assertIn('LEGACY_PREFIX="$pgrazor$original$"', bridge)
                  self.assertIn('!m.getName().startsWith(PREFIX)&&!m.getName().startsWith(LEGACY_PREFIX)', bridge)
          
              def test_installed_identity_and_historical_repack_are_preserved(self):''')
          # Historical repacker uses the canonical signing resolver, retaining old input metadata contracts.
          edit("pgs/pgs_rebrand.py",b'os.environ.get("PGRAZOR_KEYSTORE")',b'build.signing_setting("KEYSTORE")')
          # Verify no obsolete private native identities remain, including non-UTF-8 source bytes.
          left=[]
          for p in native:
              if p.endswith("/pvp_icons.h"): continue
              data=get(p).replace(b"pgrazor_native_api",b"")
              if re.search(rb"pgrazor",data,re.I):
                  left.append(p)
          assert not left,left
          # Full tracked-text and raw-byte audit. Binary files are not rewritten or counted as UTF-8 text.
          # Preserve legal notices, installed storage/crypto IDs, previous versions, external services
          # and the single public compatibility factory; make every remaining file reviewable.
          subprocess.run(["git","add","-u"],check=True)
          subprocess.run(["git","rm","--cached",TEMP],check=True)
          sys.path.insert(0,str(ROOT/"tools"))
          import pgs_reference_inventory as inv
          fresh=inv.scan(ROOT)
          doc=json.loads(get(SNAP))
          old_total=doc["remaining_occurrences"]
          for key,value in fresh.items(): doc[key]=value
          doc["native_alias_retirement"]={
              "base_commit":BASE,"retired_source_aliases":len(records),"private_getters_retired":len(getters)+1,
              "private_hook_wrappers_retired":4,
              "canonical_abi_facts_captured_before_removal":True,
              "remaining_private_native_names":left,
              "public_compatibility_export_retained":"pgrazor_native_api",
              "previous_full_name_occurrences":old_total,"remaining_full_name_occurrences":fresh["remaining_occurrences"],
              "limitations":"Source-only aliases removed; installed data and external/legacy contracts remain. Full CI and APK/device validation separate."
          }
          put(SNAP,(json.dumps(doc,indent=2,ensure_ascii=True)+"\n").encode())
          subprocess.run(["git","add",TEMP,SNAP],check=True)
          # Report actual raw matches, without printing source lines or secrets.
          binary=[]
          for p in paths:
              if p in (TEMP,SNAP): continue
              data=get(p)
              if b"\0" not in data:
                  try: data.decode("utf-8");continue
                  except UnicodeDecodeError: pass
              counts={"ascii":len(re.findall(rb"pgrazor",data,re.I)),
                      "utf16le":len(re.findall("pgrazor".encode("utf-16le"),data,re.I)),
                      "utf16be":len(re.findall("pgrazor".encode("utf-16be"),data,re.I))}
              if any(counts.values()):binary.append({"path":p,**counts})
          report={"retired_source_aliases":len(records),"retired_private_getters":len(getters)+1,
                  "retired_private_hook_wrappers":4,"remaining_text":fresh["remaining_occurrences"],
                  "remaining_text_files":fresh["remaining_files"],"abbreviations":fresh["abbreviations"]["remaining_occurrences"],
                  "remaining_binary_byte_matches":binary,"remaining_files":fresh["files"]}
          pathlib.Path("pgs-alias-retirement-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({k:v for k,v in report.items() if k!="remaining_files"},indent=2))
          
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m "PGS: retire private source aliases and preserve original native ABI"
          git push origin HEAD:refs/heads/refactor/pgs-mass-identity-20261127
      - name: Upload actual remaining-reference report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-alias-retirement-report
          path: pgs-alias-retirement-report.json
          if-no-files-found: warn
          retention-days: 14
