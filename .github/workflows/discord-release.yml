name: PGS Discord release announcement
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to announce
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      PGS_DISCORD_RELEASE_WEBHOOK:
        required: false
permissions:
  contents: read
jobs:
  announce:
    if: vars.PGS_DISCORD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Announce published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PGS_DISCORD_RELEASE_WEBHOOK: ${{ secrets.PGS_DISCORD_RELEASE_WEBHOOK }}
          PGS_DISCORD_CHANNEL_ID: ${{ vars.PGS_DISCORD_CHANNEL_ID }}
          PGS_DISCORD_RELEASE_ROLE_ID: ${{ vars.PGS_DISCORD_RELEASE_ROLE_ID }}
        run: python3 -B tools/discord_release.py
