name: PGS AUTO BACKUP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pgs-auto-backup.yml
  workflow_dispatch:
  schedule:
    - cron: '43 11 * * 0'
permissions:
  contents: read
concurrency:
  group: pgs-source-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.PGS_AUTO_BACKUP_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive tracked source and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -B tools/source_bundle.py
          cd dist
          unzip -tq PGS-source-tools.zip
          sha256sum PGS-source-tools.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          {
            echo '### PGS source snapshot'
            echo "Commit: $GITHUB_SHA"
            echo 'Archive integrity verified. No APK, signing key or Git history included.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-source-backup-${{ github.sha }}
          path: |
            dist/PGS-source-tools.zip
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 90
