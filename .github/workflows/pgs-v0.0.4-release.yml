name: PGS v0.0.4 - Verified test APK draft

on:
  push:
    branches: [pgs-v0.0.4-test]
    paths:
      - .github/workflows/pgs-v0.0.4-release.yml
  workflow_dispatch:
    inputs:
      authorized_input:
        description: Confirm authorization to use the configured hash-pinned game input and existing PGS signer
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pgs-v0.0.4-test-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build a signed test APK and create an unpublished draft
    if: github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/pgs-v0.0.4-test' && (github.event_name == 'push' || inputs.authorized_input == true)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGS_VERSION: v0.0.4
      PGS_BUILD_TOOLS: '36.0.0'
      PGS_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release ledger and authorized profile identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat pgs/PGS_LAST_VERSION_CODE)" = 2026111606
          test "$(cat pgs/VERSION)" = 0.0.4
          python -B -c "import sys; sys.path.insert(0, 'tools'); from game_update import current_profile; p=current_profile(); assert p['game_version']=='0.439.0' and p['version_code']==2026111602"
      - name: Check required private configuration before installing tools
        env:
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL }}
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 }}
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in PGS_KEYSTORE_BASE64 PGS_KEY_ALIAS PGS_STORE_PASSWORD PGS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required configuration: $name. Configure the authorized repository Actions secret."
              missing=1
            fi
          done
          test "$missing" = 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
          python -m pip install "cmake==4.4.4" "ninja==1.13.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "PGS_ART_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "PGS_NATIVE_DEPS=$RUNNER_TEMP/pgs-native-deps" >> "$GITHUB_ENV"
      - name: Prepare verified dependencies and execute source checks
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/prepare_native.py --download
          python -c "import sys; sys.path.insert(0, 'pgs'); import dex_bridges; dex_bridges.dependencies(download=True)"
          python -B tools/check.py
      - name: Configure existing signer path
        shell: bash
        run: echo "PGS_KEYSTORE=$RUNNER_TEMP/pgs-v004-validation.jks" >> "$GITHUB_ENV"
      - name: Recover and verify the existing pinned private game input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL }}
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 }}
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
          PGS_EXPECTED_CERT_SHA256: d95c6bdfcbd91dc5c9cde698487c88e4994771a475e4efde4567b8d5f44e96cf
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          trap 'rm -f "$RUNNER_TEMP/pgs-sealed-source.yml" "$RUNNER_TEMP/PreparePrivateInput.java"' EXIT
          if [[ -z "$PGS_INPUT_URL" ]]; then
            git fetch --no-tags --depth=1 origin 0179c4046a9d3089f855ae123bc326e73893e009
            git show 0179c4046a9d3089f855ae123bc326e73893e009:.github/workflows/pgs-languages-build.yml > "$RUNNER_TEMP/pgs-sealed-source.yml"
            export PGS_SEALED_INPUT="$(python -B - "$RUNNER_TEMP/pgs-sealed-source.yml" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          start = lines.index("          PGS_SEALED_INPUT: |") + 1
          payload = []
          for line in lines[start:]:
              if not line.startswith("            "):
                  break
              payload.append(line[12:])
          if len(payload) != 4 or not payload[0].startswith("format=PGS_BUILD_INPUT_V1"):
              raise SystemExit("Invalid pinned sealed input envelope")
          print("\n".join(payload))
          PY
          )"
          fi
          cat > "$RUNNER_TEMP/PreparePrivateInput.java" <<'PGS_JAVA'
          import java.io.StringReader;
          import java.net.URI;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.LinkOption;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;
          import java.nio.file.attribute.PosixFilePermissions;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.security.interfaces.RSAPublicKey;
          import java.security.spec.MGF1ParameterSpec;
          import java.util.Arrays;
          import java.util.Base64;
          import java.util.HexFormat;
          import java.util.Map;
          import java.util.Properties;
          import java.util.Set;
          import javax.crypto.Cipher;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.OAEPParameterSpec;
          import javax.crypto.spec.PSource;
          import javax.crypto.spec.SecretKeySpec;
          
          /** Runner-only input preparation. Never writes or prints the decrypted URL. */
          public final class PreparePrivateInput {
              private static final String FORMAT = "PGS_BUILD_INPUT_V1";
              private static String phase = "configuration";
          
              private static String required(String name) {
                  String value = System.getenv(name);
                  if (value == null || value.isBlank()) throw new IllegalArgumentException();
                  return value;
              }
          
              private static byte[] decode(Properties data, String name) {
                  String value = data.getProperty(name);
                  if (value == null || value.length() > 65_536) throw new IllegalArgumentException();
                  return Base64.getDecoder().decode(value);
              }
          
              private static String unseal(PrivateKey key, int rsaBytes) throws Exception {
                  String sealed = required("PGS_SEALED_INPUT");
                  if (sealed.length() > 100_000) throw new IllegalArgumentException();
                  Properties data = new Properties() {
                      @Override public synchronized Object put(Object key, Object value) {
                          if (containsKey(key)) throw new IllegalArgumentException();
                          return super.put(key, value);
                      }
                  };
                  data.load(new StringReader(sealed));
                  if (!data.stringPropertyNames().equals(Set.of("format", "rsa_key", "nonce", "ciphertext"))
                          || !FORMAT.equals(data.getProperty("format"))) throw new IllegalArgumentException();
                  byte[] wrapped = decode(data, "rsa_key");
                  byte[] nonce = decode(data, "nonce");
                  byte[] ciphertext = decode(data, "ciphertext");
                  if (wrapped.length != rsaBytes || nonce.length != 12
                          || ciphertext.length < 17 || ciphertext.length > 32_768) {
                      throw new IllegalArgumentException();
                  }
                  byte[] aesKey = null;
                  byte[] plaintext = null;
                  try {
                      Cipher rsa = Cipher.getInstance("RSA/ECB/OAEPWithSHA-256AndMGF1Padding");
                      rsa.init(Cipher.DECRYPT_MODE, key, new OAEPParameterSpec(
                              "SHA-256", "MGF1", MGF1ParameterSpec.SHA256, PSource.PSpecified.DEFAULT));
                      aesKey = rsa.doFinal(wrapped);
                      if (aesKey.length != 32) throw new IllegalArgumentException();
                      Cipher aes = Cipher.getInstance("AES/GCM/NoPadding");
                      aes.init(Cipher.DECRYPT_MODE, new SecretKeySpec(aesKey, "AES"),
                              new GCMParameterSpec(128, nonce));
                      aes.updateAAD(FORMAT.getBytes(StandardCharsets.UTF_8));
                      plaintext = aes.doFinal(ciphertext);
                      return new String(plaintext, StandardCharsets.UTF_8);
                  } finally {
                      if (aesKey != null) Arrays.fill(aesKey, (byte) 0);
                      if (plaintext != null) Arrays.fill(plaintext, (byte) 0);
                  }
              }
          
              private static void validateUrl(String url) throws Exception {
                  if (url.length() > 32_000 || url.chars().anyMatch(c -> c <= 32 || c == 127)) {
                      throw new IllegalArgumentException();
                  }
                  URI parsed = new URI(url);
                  if (!"https".equals(parsed.getScheme()) || parsed.getHost() == null
                          || parsed.getUserInfo() != null || parsed.getFragment() != null) {
                      throw new IllegalArgumentException();
                  }
              }
          
              private static void prepare() throws Exception {
                  char[] storePassword = required("PGS_STORE_PASSWORD").toCharArray();
                  char[] keyPassword = required("PGS_KEY_PASSWORD").toCharArray();
                  byte[] encoded = null;
                  Path signing = null;
                  boolean signingCreated = false;
                  boolean success = false;
                  try {
                      String expected = required("PGS_EXPECTED_CERT_SHA256");
                      if (!expected.matches("[a-f0-9]{64}")) throw new IllegalArgumentException();
                      String alias = required("PGS_KEY_ALIAS");
                      String base64 = required("PGS_KEYSTORE_BASE64");
                      if (base64.length() > 8_000_000) throw new IllegalArgumentException();
                      Path temp = Path.of(required("RUNNER_TEMP")).toRealPath();
                      signing = Path.of(required("PGS_KEYSTORE")).toAbsolutePath().normalize();
                      if (!signing.getParent().equals(temp) || Files.exists(signing, LinkOption.NOFOLLOW_LINKS)) {
                          throw new IllegalArgumentException();
                      }
                      encoded = Base64.getDecoder().decode(base64);
                      Files.createFile(signing, PosixFilePermissions.asFileAttribute(
                              PosixFilePermissions.fromString("rw-------")));
                      signingCreated = true;
                      Files.write(signing, encoded, StandardOpenOption.WRITE);
                      phase = "signing certificate";
                      KeyStore store = KeyStore.getInstance(signing.toFile(), storePassword);
                      Certificate certificate = store.getCertificate(alias);
                      if (certificate == null || !(certificate.getPublicKey() instanceof RSAPublicKey publicKey)) {
                          throw new IllegalArgumentException();
                      }
                      String actual = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
                              .digest(certificate.getEncoded()));
                      if (!MessageDigest.isEqual(expected.getBytes(StandardCharsets.US_ASCII),
                              actual.getBytes(StandardCharsets.US_ASCII))) throw new IllegalArgumentException();
                      if (!(store.getKey(alias, keyPassword) instanceof PrivateKey privateKey)) {
                          throw new IllegalArgumentException();
                      }
                      phase = "sealed input";
                      String url = System.getenv("PGS_INPUT_URL");
                      if (url == null || url.isBlank()) {
                          url = unseal(privateKey, (publicKey.getModulus().bitLength() + 7) / 8);
                      }
                      validateUrl(url);
                      phase = "pinned input download";
                      ProcessBuilder command = new ProcessBuilder("python", "-B", "tools/private_input.py");
                      Map<String, String> child = command.environment();
                      child.put("PGS_INPUT_URL", url);
                      child.remove("PGS_STORE_PASSWORD");
                      child.remove("PGS_KEY_PASSWORD");
                      child.remove("PGS_KEY_ALIAS");
                      child.remove("PGS_SEALED_INPUT");
                      child.remove("PGS_EXPECTED_CERT_SHA256");
                      // Fail with a fixed message; even future helper exceptions cannot echo the URL.
                      command.redirectOutput(ProcessBuilder.Redirect.DISCARD);
                      command.redirectError(ProcessBuilder.Redirect.DISCARD);
                      Process download = command.start();
                      child.remove("PGS_INPUT_URL");
                      int status = download.waitFor();
                      if (status != 0) throw new IllegalStateException();
                      success = true;
                      System.out.println("Pinned game input verified; temporary signing key is ready.");
                  } finally {
                      Arrays.fill(storePassword, '\0');
                      Arrays.fill(keyPassword, '\0');
                      if (encoded != null) Arrays.fill(encoded, (byte) 0);
                      if (!success && signingCreated) Files.deleteIfExists(signing);
                  }
              }
          
              public static void main(String[] args) {
                  try {
                      if (args.length != 0) throw new IllegalArgumentException();
                      prepare();
                  } catch (Exception error) {
                      System.err.println("Private input preparation failed at " + phase
                              + ". Check the configured signing secrets, sealed input and pinned game profile.");
                      System.exit(1);
                  }
              }
          }
          PGS_JAVA
          java "$RUNNER_TEMP/PreparePrivateInput.java"
      - name: Build and verify complete candidate in runner only
        env:
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f "$PGS_KEYSTORE"
          test -n "$PGS_KEY_ALIAS"
          test -n "$PGS_STORE_PASSWORD"
          test -n "$PGS_KEY_PASSWORD"
          python -B pgs/nonroot.py --apk pgs/input/game.apkm --google-browser-login
          mapfile -t reports < <(find pgs/build/nonroot -mindepth 2 -maxdepth 2 -name report.json -type f)
          test "${#reports[@]}" = 1
          python -B pgs/release_apk.py --run "$(dirname "${reports[0]}")" --output "$RUNNER_TEMP/pgs-v004-validation"
          python -B pgs/pgs_candidate.py "$RUNNER_TEMP/pgs-v004-validation/PGS.apk" --tag v0.0.4 --game-version 0.439.0 --game-version-code 2026111602 --previous-version-code 2026111606 > "$RUNNER_TEMP/pgs-v004-validation/PGS.json"
          python -B -c "import json, pathlib, os; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pgs-v004-validation/PGS.json').read_text()); assert d['pgs_version']=='v0.0.4' and d['version_code']==2026111607 and d['publish_ready'] is False and d['device_tested'] is False"
      - name: Prepare verified private draft files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgs-v004-validation"
          mv PGS.apk PGS.v0.0.4.apk
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("PGS.json")
          d = json.loads(p.read_text())
          d["apk"] = "PGS.v0.0.4.apk"
          d["source_commit"] = os.environ["GITHUB_SHA"]
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          sha256sum PGS.v0.0.4.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create private draft only (never overwrite existing release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgs-v004-validation"
          if gh release view v0.0.4 >/dev/null 2>&1; then
            echo "::error::v0.0.4 already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create v0.0.4 PGS.v0.0.4.apk PGS.json SHA256SUMS.txt build-info.json --draft --target "$GITHUB_SHA" --title "PGS v0.0.4" --notes "Test candidate from the migrated source branch. Device installation and login remain unverified."
      - name: Upload verification receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-v0.0.4-validation-receipts
          path: |
            ${{ runner.temp }}/pgs-v004-validation/PGS.json
            ${{ runner.temp }}/pgs-v004-validation/build-info.json
            ${{ runner.temp }}/pgs-v004-validation/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key and candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/pgs-v004-validation.jks" "$RUNNER_TEMP/pgs-v004-validation/PGS.apk" "$RUNNER_TEMP/pgs-v004-validation/PGS.v0.0.4.apk" "$RUNNER_TEMP/pgs-v004-validation/unsigned.apk" "$RUNNER_TEMP/pgs-v004-validation/aligned.apk" pgs/input/game.apkm
