name: PGS — Sync bilingual release notes
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pgs-release-notes-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Render and update existing draft text only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -B -m unittest discover -s tools -p test_pgs_release_notes.py
          python3 -B tools/pgs_release_notes.py "$VERSION" --output "$RUNNER_TEMP/notes.md"
          id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$VERSION"'" and .draft == true) | .id')"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo 'Exactly one existing draft is required'; exit 1; }
          [[ "$(gh api "repos/$GH_REPO/releases/$id" --jq .draft)" == true ]]
          gh api --method PATCH "repos/$GH_REPO/releases/$id" -F body=@"$RUNNER_TEMP/notes.md" --jq .id
          [[ "$(gh api "repos/$GH_REPO/releases/$id" --jq .draft)" == true ]]
