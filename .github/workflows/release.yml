# Historical upstream implementation remains in Git history:
# https://github.com/LucianoToscano/PGS/blob/89748d5be4ae5eb59e3ee3a223bfa3448bbba261/.github/workflows/release.yml
name: Legacy upstream release DISABLED in PGS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Historical release tag
        required: true
        type: string
      publish:
        description: Historical publication request (always refused)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete publication workflow
        shell: bash
        run: |
          echo "::error::Legacy release publication is disabled. Use the dedicated PGS candidate workflow."
          exit 1
