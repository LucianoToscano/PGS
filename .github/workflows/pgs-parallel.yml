name: PGS parallel-install experimental candidate

on:
  push:
    branches: [fix/pgs-parallel-installation]
    paths:
      - .github/workflows/pgs-parallel.yml

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGRAZOR_BUILD_TOOLS: '36.0.0'
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android signing tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Download verified PGS build
        uses: actions/download-artifact@v4
        with:
          name: PGS-v0.3.8-pgs.2
          path: prebuilt
          run-id: 45959091607
          github-token: ${{ github.token }}
      - name: Verify input package
        run: |
          set -euo pipefail
          echo '595103b36163776b919befe57ae399b2dcc1dff0234e2c0686331389926d137b  prebuilt/PGS.apk' | sha256sum -c -
          python -B - <<'PY'
          import sys
          import zipfile
          sys.path.insert(0, 'pgrazor')
          import axml
          with zipfile.ZipFile('prebuilt/PGS.apk') as archive:
              data = axml.inspect_manifest(archive.read('AndroidManifest.xml'))
              assert data['package'] == 'com.nianticlabs.pokemongo'
              assert data['split'] is None
          print('Original signed game manifest verified.')
          PY
      - name: Recover private PGS release key
        env:
          SIGNING_KEY_B64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGRAZOR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY_B64"
          python -B - <<'PY'
          from pathlib import Path
          import base64
          import os
          key = Path(os.environ['RUNNER_TEMP']) / 'pgs-parallel-signing.jks'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY_B64'], validate=True))
          key.chmod(0o600)
          PY
          printf 'PGRAZOR_KEYSTORE=%s/pgs-parallel-signing.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Re-sign independent-package PGS APK
        env:
          PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
          PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
          PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python -B pgrazor/parallel_apk.py --input prebuilt/PGS.apk --output candidate/PGS-Parallel.apk
      - name: Verify clone package before upload
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          import json
          import sys
          import zipfile
          sys.path.insert(0, 'pgrazor')
          import axml
          path = Path('candidate/PGS-Parallel.apk')
          receipt = json.loads(Path('candidate/PGS-Parallel.json').read_text())
          with zipfile.ZipFile(path) as archive:
              info = axml.inspect_manifest(archive.read('AndroidManifest.xml'))
              assert info['package'] == 'app.pgs.spoofers'
              assert info['split'] is None
              assert archive.testzip() is None
          assert receipt['status'] == 'PACKAGE_ONLY_VERIFIED'
          assert receipt['device_tested'] is False
          assert path.stat().st_size > 100_000_000
          print('Standalone PGS package layer verified; login/gameplay untested.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PGS-Parallel-v0.3.8-pgs.2-EXPERIMENTAL
          path: |
            candidate/PGS-Parallel.apk
            candidate/PGS-Parallel.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pgs-parallel-signing.jks"
