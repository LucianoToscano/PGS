name: PGS v0.0.4 - Verified test APK draft

on:
  push:
    branches: [pgs-v0.0.4-test]
    paths:
      - .github/workflows/pgs-v0.0.4-release.yml
  workflow_dispatch:
    inputs:
      authorized_input:
        description: Confirm authorization to use the configured hash-pinned game input and existing PGS signer
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pgs-v0.0.4-test-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build a signed test APK and create an unpublished draft
    if: github.repository == 'LucianoToscano/PGS' && github.ref == 'refs/heads/pgs-v0.0.4-test' && (github.event_name == 'push' || inputs.authorized_input == true)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGS_VERSION: v0.0.4
      PGS_BUILD_TOOLS: '36.0.0'
      PGS_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release ledger and authorized profile identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat pgs/PGS_LAST_VERSION_CODE)" = 2026111606
          test "$(cat pgs/VERSION)" = 0.0.4
          python -B -c "import sys; sys.path.insert(0, 'tools'); from game_update import current_profile; p=current_profile(); assert p['game_version']=='0.439.0' and p['version_code']==2026111602"
      - name: Check required private configuration before installing tools
        env:
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL }}
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 }}
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in PGS_KEYSTORE_BASE64 PGS_KEY_ALIAS PGS_STORE_PASSWORD PGS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required configuration: $name. Configure the authorized repository Actions secret."
              missing=1
            fi
          done
          test "$missing" = 0
      - name: Recover and verify the exact original game input
        env:
          PGS_INPUT_URL: ${{ secrets.PGS_INPUT_URL }}
          PGS_BUILD_INPUT_TOKEN: ${{ secrets.PGS_BUILD_INPUT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          input_asset='https://api.github.com/repos/LucianoToscano/PGBR/releases/assets/794374426'
          if [[ -z "$PGS_INPUT_URL" ]]; then
            export PGS_INPUT_URL="$input_asset"
          fi
          if [[ "$PGS_INPUT_URL" == "$input_asset" && -n "$PGS_BUILD_INPUT_TOKEN" ]]; then
            export GITHUB_TOKEN="$PGS_BUILD_INPUT_TOKEN"
          fi
          if ! python -B tools/private_input.py --input-only; then
            echo "::error::Original input is unavailable. Configure PGS_BUILD_INPUT_TOKEN with read access to the private PGBR build-inputs asset, or configure PGS_INPUT_URL for an authorized copy with the same hash."
            exit 1
          fi
          echo "c6d3c04c38ca2f2446957633b4fee8c93dcc9cebdbbaddc9cb9651722ef8f54f  pgs/input/game.apkm" | sha256sum -c -
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36" "ndk;27.3.13750724" "ndk;29.0.14206865"
          python -m pip install "cmake==4.4.4" "ninja==1.13.2"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "PGS_ART_NDK=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "PGS_NATIVE_DEPS=$RUNNER_TEMP/pgs-native-deps" >> "$GITHUB_ENV"
      - name: Prepare verified dependencies and execute source checks
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/prepare_native.py --download
          python -c "import sys; sys.path.insert(0, 'pgs'); import dex_bridges; dex_bridges.dependencies(download=True)"
          python -B tools/check.py
      - name: Configure existing signer path
        shell: bash
        run: echo "PGS_KEYSTORE=$RUNNER_TEMP/pgs-v004-validation.jks" >> "$GITHUB_ENV"
      - name: Load the existing PGS signer after source checks
        env:
          PGS_KEYSTORE_BASE64: ${{ secrets.PGS_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -B tools/private_input.py --key-only
      - name: Build and verify complete candidate in runner only
        env:
          PGS_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS }}
          PGS_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD }}
          PGS_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f "$PGS_KEYSTORE"
          test -n "$PGS_KEY_ALIAS"
          test -n "$PGS_STORE_PASSWORD"
          test -n "$PGS_KEY_PASSWORD"
          python -B pgs/nonroot.py --apk pgs/input/game.apkm --google-browser-login
          mapfile -t reports < <(find pgs/build/nonroot -mindepth 2 -maxdepth 2 -name report.json -type f)
          test "${#reports[@]}" = 1
          python -B pgs/release_apk.py --run "$(dirname "${reports[0]}")" --output "$RUNNER_TEMP/pgs-v004-validation"
          python -B pgs/pgs_candidate.py "$RUNNER_TEMP/pgs-v004-validation/PGS.apk" --tag v0.0.4 --game-version 0.439.0 --game-version-code 2026111602 --previous-version-code 2026111606 > "$RUNNER_TEMP/pgs-v004-validation/PGS.json"
          python -B -c "import json, pathlib, os; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'pgs-v004-validation/PGS.json').read_text()); assert d['pgs_version']=='v0.0.4' and d['version_code']==2026111607 and d['publish_ready'] is False and d['device_tested'] is False"
      - name: Prepare verified private draft files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgs-v004-validation"
          mv PGS.apk PGS.v0.0.4.apk
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("PGS.json")
          d = json.loads(p.read_text())
          d["apk"] = "PGS.v0.0.4.apk"
          d["source_commit"] = os.environ["GITHUB_SHA"]
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          sha256sum PGS.v0.0.4.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create private draft only (never overwrite existing release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pgs-v004-validation"
          if gh release view v0.0.4 >/dev/null 2>&1; then
            echo "::error::v0.0.4 already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create v0.0.4 PGS.v0.0.4.apk PGS.json SHA256SUMS.txt build-info.json --draft --target "$GITHUB_SHA" --title "PGS v0.0.4" --notes "Test candidate from the migrated source branch. Device installation and login remain unverified."
      - name: Upload verification receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-v0.0.4-validation-receipts
          path: |
            ${{ runner.temp }}/pgs-v004-validation/PGS.json
            ${{ runner.temp }}/pgs-v004-validation/build-info.json
            ${{ runner.temp }}/pgs-v004-validation/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key and candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/pgs-v004-validation.jks" "$RUNNER_TEMP/pgs-v004-validation/PGS.apk" "$RUNNER_TEMP/pgs-v004-validation/PGS.v0.0.4.apk" "$RUNNER_TEMP/pgs-v004-validation/unsigned.apk" "$RUNNER_TEMP/pgs-v004-validation/aligned.apk" pgs/input/game.apkm
