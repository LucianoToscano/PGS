name: Hundo feed regression checks
on:
  pull_request:
    paths:
      - 'tools/hundo-feed/cloudflare/**'
      - '.github/workflows/hundo-feed-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test Worker against offline synthetic fixtures
        run: node --test tools/hundo-feed/cloudflare/worker.test.mjs
