name: PGS v0.3.8-pgs.3 - Same package update

on:
  push:
    branches: [fix/pgs-same-package-updates]
    paths:
      - .github/workflows/pgs-same-package-update.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: pgs-same-package-update-v0.3.8-pgs.3
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PGRAZOR_BUILD_TOOLS: '36.0.0'
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test package and versionCode rules
        run: |
          set -euo pipefail
          python -B -m unittest discover -s pgrazor/test -p test_pgs_update.py -v
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android signing tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdk_root="$ANDROID_SDK_ROOT"
          test -f "$sdk_root/build-tools/36.0.0/apksigner"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Retrieve previously verified full PGS APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PGS-v0.3.8-pgs.2
          run-id: 45959091607
          github-token: ${{ github.token }}
          path: prebuilt
      - name: Verify complete original APK
        run: |
          set -euo pipefail
          test -f prebuilt/PGS.apk
          echo '595103b36163776b919befe57ae399b2dcc1dff0234e2c0686331389926d137b  prebuilt/PGS.apk' | sha256sum -c -
          python -B - <<'PY'
          import sys
          import zipfile
          sys.path.insert(0, 'pgrazor')
          import axml
          with zipfile.ZipFile('prebuilt/PGS.apk') as source:
              info = axml.inspect_manifest(source.read('AndroidManifest.xml'))
              assert info['package'] == 'com.nianticlabs.pokemongo', info
              assert info['versionCode'] == 2026111602, info
              assert info['versionName'] == '0.439.0', info
              assert info['split'] is None
              assert 'lib/arm64-v8a/libil2cpp.so' in source.namelist()
          print('Verified source package and Android versionCode.')
          PY
      - name: Load existing PGS release signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.PGS_KEYSTORE_BASE64 || secrets.PGRAZOR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY_B64"
          python -B - <<'PY'
          from pathlib import Path
          import base64
          import os
          key = Path(os.environ['RUNNER_TEMP']) / 'pgs-update-release.jks'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY_B64'], validate=True))
          key.chmod(0o600)
          PY
          printf 'PGRAZOR_KEYSTORE=%s/pgs-update-release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Produce signed PGS v0.3.8-pgs.3
        env:
          PGRAZOR_KEY_ALIAS: ${{ secrets.PGS_KEY_ALIAS || secrets.PGRAZOR_KEY_ALIAS }}
          PGRAZOR_STORE_PASSWORD: ${{ secrets.PGS_STORE_PASSWORD || secrets.PGRAZOR_STORE_PASSWORD }}
          PGRAZOR_KEY_PASSWORD: ${{ secrets.PGS_KEY_PASSWORD || secrets.PGRAZOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python -B pgrazor/pgs_update.py \
            --input prebuilt/PGS.apk \
            --output candidate/PGS.apk \
            --expected-sha256 595103b36163776b919befe57ae399b2dcc1dff0234e2c0686331389926d137b \
            --previous-version-code 2026111602
      - name: Verify final package, SHA and version continuity
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path
          sys.path.insert(0, 'pgrazor')
          import axml
          file = Path('candidate/PGS.apk')
          metadata = json.loads(Path('candidate/PGS.json').read_text(encoding='utf8'))
          with zipfile.ZipFile(file) as archive:
              info = axml.inspect_manifest(archive.read('AndroidManifest.xml'))
              assert info['package'] == 'com.nianticlabs.pokemongo'
              assert info['versionCode'] == 2026111603
              assert info['versionName'] == '0.439.0'
              assert info['split'] is None
              assert 'lib/arm64-v8a/libil2cpp.so' in archive.namelist()
              assert archive.testzip() is None
          assert metadata['signing_certificate_sha256'] == 'd95c6bdfcbd91dc5c9cde698487c88e4994771a475e4efde4567b8d5f44e96cf'
          assert metadata['device_tested'] is False
          assert metadata['version_code'] == 2026111603
          assert file.stat().st_size > 100_000_000
          with file.open('rb') as handle:
              sha = hashlib.file_digest(handle, 'sha256').hexdigest()
          assert metadata['sha256'] == sha
          Path('candidate/SHA256SUMS.txt').write_text(sha + '  PGS.apk\n')
          print('PGS update signed and verified; no device test claimed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGS-v0.3.8-pgs.3
          path: |
            candidate/PGS.apk
            candidate/PGS.json
            candidate/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pgs-update-release.jks"
